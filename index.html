<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Hitu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #ff9a9e, transparent 35%),
        radial-gradient(circle at bottom right, #8ec5fc, transparent 35%),
        linear-gradient(135deg, #1d1635, #0b1026 60%, #111827);
      color: white;
    }

    .background-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(50px);
      animation: glowMove 7s infinite alternate ease-in-out;
      z-index: 0;
    }

    @keyframes glowMove {
      from { transform: translate(-120px, -90px) scale(1); }
      to { transform: translate(120px, 80px) scale(1.25); }
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(92%, 780px);
      padding: 42px 30px;
      text-align: center;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45), inset 0 0 25px rgba(255,255,255,0.08);
      backdrop-filter: blur(22px);
      transform: scale(0.75);
      opacity: 0;
      animation: popOut 1.15s ease forwards;
    }

    @keyframes popOut {
      0% { transform: scale(0.75) translateY(60px); opacity: 0; }
      70% { transform: scale(1.05) translateY(-8px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .tag {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.22);
      letter-spacing: 2px;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 18px;
      animation: floatText 3s infinite ease-in-out;
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #fff, #ffe6ff, #bde0fe, #fff);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 35px rgba(255,255,255,0.25);
    }

    h2 {
      font-size: clamp(28px, 6vw, 56px);
      margin-bottom: 28px;
      color: #ffd6ff;
      text-shadow: 0 0 28px rgba(255, 214, 255, 0.55);
    }

    .message-card {
      margin: 30px auto 0;
      max-width: 610px;
      padding: 28px 24px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      animation: wishPop 0.9s ease forwards, cardFloat 4s 0.9s infinite ease-in-out;
    }

    .hidden {
      display: none;
    }

    .small-title {
      font-size: clamp(34px, 7vw, 64px);
      margin-bottom: 12px;
    }

    @keyframes wishPop {
      0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
      70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .message-card p {
      font-size: clamp(16px, 3.4vw, 22px);
      line-height: 1.7;
      margin-bottom: 16px;
      color: rgba(255,255,255,0.95);
    }

    .signature {
      margin-top: 18px;
      font-size: clamp(17px, 3.5vw, 24px);
      color: #fff3b0;
      font-weight: 600;
    }

    .btn {
      margin-top: 28px;
      border: none;
      cursor: pointer;
      padding: 14px 28px;
      border-radius: 999px;
      color: #111827;
      font-weight: 700;
      font-size: 16px;
      background: linear-gradient(135deg, #ffffff, #ffd6ff, #bde0fe);
      box-shadow: 0 12px 35px rgba(255,255,255,0.25);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-5px) scale(1.04);
      box-shadow: 0 18px 45px rgba(255,255,255,0.4);
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes floatText {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .balloon {
      position: absolute;
      bottom: -130px;
      width: 48px;
      height: 62px;
      border-radius: 50% 50% 45% 45%;
      background: rgba(255,255,255,0.35);
      animation: balloonUp linear infinite;
      z-index: 1;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 55px;
      background: rgba(255,255,255,0.45);
      left: 50%;
      top: 62px;
    }

    @keyframes balloonUp {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-120vh) rotate(16deg); opacity: 0; }
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 14px;
      background: white;
      opacity: 0.85;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(520deg); opacity: 0; }
    }

    .sparkle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 18px white;
      animation: sparkle 2.5s infinite ease-in-out;
      z-index: 3;
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    @media (max-width: 520px) {
      body { overflow-y: auto; padding: 30px 0; }
      .container { padding: 32px 18px; border-radius: 28px; }
      .message-card { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>

  <main class="container">
    <div class="sparkle" style="left: 8%; top: 12%; animation-delay: .1s;"></div>
    <div class="sparkle" style="right: 10%; top: 18%; animation-delay: .7s;"></div>
    <div class="sparkle" style="left: 16%; bottom: 12%; animation-delay: 1.2s;"></div>
    <div class="sparkle" style="right: 18%; bottom: 18%; animation-delay: 1.8s;"></div>

    <span class="tag">A Special Surprise</span>
    <h1>Hey Hitu ✨</h1>
    <h2>Tap to open your wish</h2>

    <button class="btn" id="openBtn" onclick="openWish()">Open Birthday Wish 🎁</button>

    <section class="message-card hidden" id="wishCard">
      <h1 class="small-title">Happy Birthday</h1>
      <h2>Hitu 😍🎂</h2>
      <p>God may bless you and bring solace, and always keep a winsome smile on your face.</p>
      <p>Enjoy your day with your friends.</p>
      <div class="signature">~ Udit Singh</div>
    </section>
  </main>

  <script>
    const balloonColors = ["#ffafcc", "#bde0fe", "#caffbf", "#ffd6a5", "#ffc8dd"];
    const confettiColors = ["#ffffff", "#ffd6ff", "#bde0fe", "#ffafcc", "#fff3b0"];

    function createBalloons() {
      for (let i = 0; i < 12; i++) {
        const balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.style.left = Math.random() * 100 + "vw";
        balloon.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
        balloon.style.animationDuration = 7 + Math.random() * 7 + "s";
        balloon.style.animationDelay = Math.random() * 7 + "s";
        document.body.appendChild(balloon);
      }
    }

    function createConfetti(count = 55) {
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        piece.style.animationDuration = 3 + Math.random() * 4 + "s";
        piece.style.animationDelay = Math.random() * 3 + "s";
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
        document.body.appendChild(piece);
      }
    }

    function openWish() {
      const wishCard = document.getElementById("wishCard");
      const openBtn = document.getElementById("openBtn");
      const heading = document.querySelector("main h1");
      const subHeading = document.querySelector("main h2");
      const tag = document.querySelector(".tag");

      wishCard.classList.remove("hidden");
      openBtn.style.display = "none";
      heading.style.display = "none";
      subHeading.style.display = "none";
      tag.textContent = "Birthday Wish Unlocked";
      createConfetti(120);
    }

    createBalloons();
    createConfetti();
  </script>
</body>
</html>
